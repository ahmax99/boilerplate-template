name: Toggle Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: true
      enabled:
        description: 'Turn maintenance mode ON (serve the static page, delete the WAF, zero provisioned concurrency). Uncheck to return to Live.'
        type: boolean
        required: true

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  toggle:
    name: ${{ inputs.enabled && 'Enable' || 'Disable' }} maintenance → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      TF_IN_AUTOMATION: 'true'
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ inputs.environment }}
      ENABLED: ${{ inputs.enabled }}
      TF_VAR_project_name: ${{ github.event.repository.name }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_maintenance_mode: ${{ inputs.enabled }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_root_domain: ${{ vars.TF_VAR_root_domain }}
      TF_VAR_contact_to_email: ${{ vars.TF_VAR_contact_to_email }}
      TF_VAR_from_email: ${{ vars.TF_VAR_from_email }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
      TF_VAR_resend_api_key: ${{ secrets.TF_VAR_resend_api_key }}
      TF_VAR_session_secret: ${{ secrets.TF_VAR_session_secret }}
      TF_VAR_backend_sentry_dsn: ${{ secrets.TF_VAR_backend_sentry_dsn }}
      TF_VAR_frontend_sentry_dsn: ${{ secrets.TF_VAR_frontend_sentry_dsn }}
      TF_VAR_central_ecr_account_id: ${{ vars.CENTRAL_ECR_ACCOUNT_ID }}
      TF_VAR_dns_account_role_arn: ${{ vars.DNS_ACCOUNT_ROLE_ARN }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_org_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id: ${{ github.repository_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.14'
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ToggleMaintenance${{ inputs.environment }}

      - name: Apply
        uses: ./.github/actions/terraform-apply-env
        with:
          environment: ${{ inputs.environment }}
          project-name: ${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}
          central-ecr-account-id: ${{ vars.CENTRAL_ECR_ACCOUNT_ID }}
          ecr-push-role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          apply-role-arn: ${{ vars.TF_APPLY_ROLE_ARN }}

      - name: Verify at the edge
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          ROOT_DOMAIN: ${{ vars.TF_VAR_root_domain }}
        run: |
          set -euo pipefail
          # Must be the custom domain, not the *.cloudfront.net one: the
          # viewer-request Lambda@Edge only allows the custom host in Live mode.
          # Mirrors local.domain_name in infra/locals.tf.
          if [ "$ENVIRONMENT" = "prod" ]; then
            domain="${PROJECT_NAME}.${ROOT_DOMAIN}"
          else
            domain="${PROJECT_NAME}.${ENVIRONMENT}.${ROOT_DOMAIN}"
          fi
          aws cloudfront wait distribution-deployed \
            --id "$(terraform -chdir=infra output -raw cloudfront_distribution_id)"
          # "/some/deep/link" only has to 200 in maintenance mode (the S3
          # catch-all); it isn't a real app route, so Live mode would
          # legitimately 404 there — only check the two real endpoints then.
          if [ "$ENABLED" = "true" ]; then
            paths=("/" "/some/deep/link" "/api/v1/posts")
          else
            paths=("/" "/api/v1/posts")
          fi
          for path in "${paths[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${domain}${path}")
            echo "GET ${path} → ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Expected 200 on ${path} (maintenance=${ENABLED}), got ${code}"
              exit 1
            fi
          done

      - name: Generate a token for the maintenance bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-environments: write

      - name: Record the flag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh variable set MAINTENANCE_MODE --env "$ENVIRONMENT" --body "$ENABLED"
          echo "MAINTENANCE_MODE=${ENABLED} for ${ENVIRONMENT}"
